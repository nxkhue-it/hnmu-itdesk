# ========================================================
# Cấu hình Nginx Reverse Proxy cho Hệ Thống CNTT Trường Đại Học
# File đặt tại: /etc/nginx/sites-available/itdesk.hnmu.edu.vn
# ========================================================

upstream itdesk_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Tự động chuyển hướng từ HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name itdesk.hnmu.edu.vn 10.10.x.x; # Thay bằng tên miền nội bộ hoặc IP máy chủ

    return 301 https://$host$request_uri;
}

# Cấu hình HTTPS bảo mật trong mạng nội bộ
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itdesk.hnmu.edu.vn;

    # Chứng chỉ SSL nội bộ trường hoặc Wildcard *.hnmu.edu.vn
    ssl_certificate /etc/ssl/certs/hnmu.edu.vn.crt;
    ssl_certificate_key /etc/ssl/private/hnmu.edu.vn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Giới hạn kích thước file tải lên (ảnh đính kèm báo hỏng thiết bị: tối đa 25MB)
    client_max_body_size 25M;

    # Nén Gzip tăng tốc độ tải trang trên mạng Wi-Fi trường
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://itdesk_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache tĩnh cho font và ảnh
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://itdesk_backend;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    access_log /var/log/nginx/itdesk_access.log;
    error_log /var/log/nginx/itdesk_error.log;
}
